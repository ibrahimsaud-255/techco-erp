<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<style id="thmanyah-font">
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Black.woff2") format("woff2");font-weight:800 900;font-display:swap}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>المدونة — إبراهيم سعود</title>
<meta name="description" content="مقالات إبراهيم سعود في تقنية الأعمال والبودكاست.">
<meta name="theme-color" content="#0a0a0b">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --gold:#c8901f; --gold2:#e0a82e;
    --bg:#f7f6f3; --panel:#ffffff; --ink:#1c1b18; --muted:#6b6a64;
    --line:#e7e4dd; --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.04);
  }
  html[data-theme="dark"]{
    --gold:#f5a623; --gold2:#ffc24d;
    --bg:#0a0a0b; --panel:#141416; --ink:#f1f0ee; --muted:#9b9ba3;
    --line:#2a2a2f; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Thmanyah Sans','Tajawal',system-ui,sans-serif;
       line-height:1.85;transition:background .25s,color .25s;min-height:100vh}
  a{color:var(--gold);text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:18px 18px 90px}
  /* الترويسة */
  header.bar{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
    background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
  .bar-in{max-width:760px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:var(--ink)}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}
  .bar-actions{display:flex;align-items:center;gap:8px}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:.15s}
  .icon-btn:hover{border-color:var(--gold)}
  .back-link{font-size:14px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;padding:8px 4px}
  .back-link:hover{color:var(--gold)}
  /* مقدّمة القائمة */
  .intro{padding:34px 2px 10px}
  .intro h1{font-size:30px;font-weight:900;margin:0 0 6px}
  .intro p{color:var(--muted);margin:0;font-size:15px}
  /* بطاقة مقال */
  .card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:18px;
    overflow:hidden;margin-top:18px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);border-color:var(--gold)}
  .card .cover{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line);display:block}
  .card .body{padding:16px 18px}
  .card h2{margin:0 0 6px;font-size:21px;font-weight:800;color:var(--ink)}
  .card .ex{color:var(--muted);font-size:14.5px;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* سطر المؤلّف */
  .byline{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .byline img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--line);border:1px solid var(--line)}
  .byline .who{font-weight:800;color:var(--ink);font-size:13.5px;line-height:1.2}
  .byline .when{font-size:12px;color:var(--muted)}
  .dates{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .sep{opacity:.5}
  /* صفحة المقال */
  .article .cover{width:100%;max-height:420px;object-fit:cover;border-radius:18px;background:var(--line);margin:10px 0 22px;box-shadow:var(--shadow)}
  .article h1{font-size:32px;font-weight:900;line-height:1.4;margin:6px 0 16px}
  .article .meta{display:flex;align-items:center;gap:12px;padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .article .meta img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--line);border:1px solid var(--line)}
  .article .meta .who{font-weight:800;color:var(--ink);font-size:15px}
  .article .meta .when{font-size:13px;color:var(--muted);margin-top:2px}
  .content{font-size:18px;line-height:2.05}
  .content h2{font-size:24px;font-weight:900;margin:30px 0 10px}
  .content h3{font-size:20px;font-weight:800;margin:24px 0 8px}
  .content p{margin:0 0 16px}
  .content ul,.content ol{margin:0 0 18px;padding-inline-start:26px}
  .content li{margin-bottom:8px}
  .content blockquote{margin:18px 0;padding:12px 18px;border-inline-start:4px solid var(--gold);
    background:color-mix(in srgb,var(--gold) 8%,transparent);border-radius:0 12px 12px 0;color:var(--ink)}
  .content strong{font-weight:800}
  /* حالات */
  .empty{text-align:center;color:var(--muted);padding:70px 10px;font-size:15px}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;
    animation:r .7s linear infinite;margin:60px auto}
  @keyframes r{to{transform:rotate(360deg)}}
  .foot{text-align:center;color:var(--muted);font-size:13px;margin-top:48px}
  .foot a{font-weight:700}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="./"><span class="dot"></span> المدونة</a>
    <div class="bar-actions">
      <button class="back-link" id="backBtn" style="display:none" onclick="goList()">↩ كل المقالات</button>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="الوضع الليلي/الفاتح"></button>
    </div>
  </div>
</header>

<div class="wrap" id="root">
  <div class="spin"></div>
</div>

<script>
const SUPA_URL='https://rrerwhhxrjyzmnnjsfev.supabase.co';
const SUPA_KEY='sb_publishable_T-ka4hy2LVRjUuf0wUH9yA_g4Emxm13';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const root=document.getElementById('root');
let SETTINGS={author_name:'إبراهيم سعود',author_title:'تقنية أعمال وبودكاست',author_avatar_url:''};

/* ===== الثيم (ليلي/فاتح) ===== */
const ICON_SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeBtn').innerHTML = t==='dark'?ICON_SUN:ICON_MOON;
  document.querySelector('meta[name=theme-color]').setAttribute('content', t==='dark'?'#0a0a0b':'#f7f6f3');
}
function toggleTheme(){
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  localStorage.setItem('blog_theme',t);applyTheme(t);
}
applyTheme(localStorage.getItem('blog_theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));

/* ===== أدوات ===== */
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AV='https://raw.githubusercontent.com/ibrahimsaud-255/ibrahimsaud-site/main/my_photo.jpg';
function avatar(){return SETTINGS.author_avatar_url || AV;}
// تنظيف بسيط لـ HTML المقال (نسمح بوسوم التنسيق فقط)
function sanitize(html){
  const div=document.createElement('div');div.innerHTML=html||'';
  div.querySelectorAll('*').forEach(el=>{
    if(!/^(H2|H3|P|UL|OL|LI|BLOCKQUOTE|STRONG|EM|BR)$/.test(el.tagName)){
      el.replaceWith(...el.childNodes); return;
    }
    [...el.attributes].forEach(a=>el.removeAttribute(a.name));
  });
  return div.innerHTML;
}
function datesLine(p){
  const g=p.greg_date||'', h=p.hijri_date||'';
  if(g&&h) return `${esc(g)} <span class="sep">·</span> ${esc(h)} هـ`;
  return esc(g||h);
}

/* ===== تحميل الإعدادات (الصورة الشخصية المشتركة) ===== */
async function loadSettings(){
  try{const{data}=await sb.from('blog_settings').select('*').eq('id',1).single();if(data)SETTINGS=data;}catch(_){}
}

/* ===== عرض القائمة ===== */
async function goList(){
  history.pushState({},'',location.pathname);
  document.getElementById('backBtn').style.display='none';
  document.title='المدونة — إبراهيم سعود';
  root.innerHTML='<div class="spin"></div>';
  const{data,error}=await sb.from('posts').select('*').eq('status','published').order('published_at',{ascending:false});
  if(error){root.innerHTML='<div class="empty">تعذّر تحميل المقالات.</div>';return;}
  if(!data||!data.length){root.innerHTML=`
    <div class="intro"><h1>المدونة</h1><p>${esc(SETTINGS.author_name)} — ${esc(SETTINGS.author_title)}</p></div>
    <div class="empty">لا توجد مقالات منشورة بعد.</div>`;return;}
  root.innerHTML=`
    <div class="intro"><h1>المدونة</h1><p>${esc(SETTINGS.author_name)} — ${esc(SETTINGS.author_title)}</p></div>
    ${data.map(cardHTML).join('')}
    <div class="foot">© إبراهيم سعود — <a href="/">الصفحة الرئيسية</a></div>`;
}
function cardHTML(p){
  return `<a class="card" href="?id=${encodeURIComponent(p.id)}" onclick="return openPost(event,'${p.id}')">
    ${p.cover_url?`<img class="cover" src="${esc(p.cover_url)}" alt="${esc(p.title)}" loading="lazy">`:''}
    <div class="body">
      <h2>${esc(p.title)}</h2>
      ${p.excerpt?`<p class="ex">${esc(p.excerpt)}</p>`:''}
      <div class="byline">
        <img src="${esc(avatar())}" alt="${esc(SETTINGS.author_name)}">
        <div>
          <div class="who">${esc(SETTINGS.author_name)}</div>
          <div class="when dates">${datesLine(p)}</div>
        </div>
      </div>
    </div>
  </a>`;
}

/* ===== عرض المقال ===== */
function openPost(ev,id){if(ev)ev.preventDefault();showPost(id);return false;}
async function showPost(id){
  history.pushState({},'','?id='+encodeURIComponent(id));
  document.getElementById('backBtn').style.display='';
  root.innerHTML='<div class="spin"></div>';
  window.scrollTo(0,0);
  const{data:p,error}=await sb.from('posts').select('*').eq('id',id).single();
  if(error||!p){root.innerHTML='<div class="empty">المقال غير موجود.</div>';return;}
  document.title=p.title+' — المدونة';
  root.innerHTML=`<article class="article">
    ${p.cover_url?`<img class="cover" src="${esc(p.cover_url)}" alt="${esc(p.title)}">`:''}
    <h1>${esc(p.title)}</h1>
    <div class="meta">
      <img src="${esc(avatar())}" alt="${esc(SETTINGS.author_name)}">
      <div>
        <div class="who">${esc(SETTINGS.author_name)}</div>
        <div class="when dates">${datesLine(p)} <span class="sep">·</span> ${p.reading_min||1} د قراءة</div>
      </div>
    </div>
    <div class="content">${sanitize(p.body_html)}</div>
    <div class="foot">— ${esc(SETTINGS.author_name)} · <a href="./">عودة للمدونة</a></div>
  </article>`;
}

/* ===== توجيه ===== */
window.addEventListener('popstate',route);
function route(){
  const id=new URLSearchParams(location.search).get('id');
  if(id) showPost(id); else goList();
}
(async function init(){await loadSettings();route();})();
</script>
</body>
</html>
