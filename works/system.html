<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام إدارة الأعمال — معاينة</title>
<link rel="icon" href="../assets/logo-black.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b0a1a;color:#ece9f5;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:80px}
  .hd{max-width:1100px;margin:0 auto;padding:22px 18px 10px;text-align:center}
  .hd .cat{display:inline-block;font-size:12px;font-weight:700;color:#12cdbd;border:1px solid rgba(18,205,189,.4);background:rgba(18,205,189,.1);padding:4px 13px;border-radius:100px;margin-bottom:12px}
  .hd h1{margin:0 0 8px;font-size:clamp(1.4rem,4vw,2rem);color:#fff}
  .hd p{margin:0;color:rgba(255,255,255,.66);font-size:14.5px;max-width:60ch;margin-inline:auto;line-height:1.8}
  .shot{max-width:1100px;margin:18px auto 0;padding:0 14px}
  .shot img{width:100%;height:auto;display:block;border-radius:16px;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
  .cap{max-width:1100px;margin:14px auto 0;padding:0 18px;color:rgba(255,255,255,.5);font-size:12.5px;text-align:center}
</style>
</head>
<body>
  <div class="hd">
    <span class="cat">نظام إدارة أعمال (ERP)</span>
    <h1>نظام إدارة الأعمال</h1>
    <p>لوحة قيادة عربية كاملة: مبيعات، فوترة، عملاء، مشاريع، اشتراكات، وتقارير — أساسٌ واحد نُخصّصه بهويّة كل عميل.</p>
  </div>
  <div class="shot"><img src="assets/erp-demo.png" alt="لوحة نظام إدارة الأعمال — عرض تجريبي" loading="eager"></div>
  <p class="cap">لقطة من الوضع التجريبي للوحة القيادة.</p>
  <script src="/works/preview-bar.js" data-name="نظام إدارة الأعمال"></script>
</body>
</html>
