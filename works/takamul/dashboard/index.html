<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم | التكامل المتحدة للخدمات اللوجستية</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/favicon.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- ============ الشريط الجانبي ============ -->
  <aside class="side" id="side">
    <div class="side__brand">
      <img src="../assets/img/favicon.png" alt="">
      <div>
        <b>لوحة التحكم</b>
        <span>التكامل المتحدة</span>
      </div>
    </div>

    <nav id="nav">
      <button data-v="home" class="on"><i><svg viewBox="0 0 24 24"><path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-7h6v7"/></svg></i> لوحة القيادة</button>
      <button data-v="settings"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.9 19l-.1.1A2 2 0 1 1 5 16.3l.1-.1A1.6 1.6 0 0 0 4 13.5a2 2 0 1 1 0-4 1.6 1.6 0 0 0 1.2-2.7l-.1-.1A2 2 0 1 1 7.9 3.9l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7 2 2 0 1 1 0 4 1.6 1.6 0 0 0-1.5 1.3z"/></svg></i> إعدادات الموقع</button>
      <button data-v="services"><i><svg viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 21v-8"/></svg></i> الخدمات <em id="c-services">0</em></button>
      <button data-v="posts"><i><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></i> المدونة <em id="c-posts">0</em></button>
      <button data-v="events"><i><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg></i> الأحداث <em id="c-events">0</em></button>
      <button data-v="achievements"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="m8.2 14-1.7 7 5.5-3 5.5 3-1.7-7"/></svg></i> الإنجازات <em id="c-achievements">0</em></button>
      <button data-v="clients"><i><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9.5" r="2.5"/><path d="M2 20a6 6 0 0 1 12 0M15.5 14.5A5.5 5.5 0 0 1 22 20"/></svg></i> العملاء <em id="c-clients">0</em></button>
      <button data-v="jobs"><i><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></i> الوظائف <em id="c-jobs">0</em></button>
      <button data-v="publish"><i><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></i> النشر والتصدير</button>
    </nav>

    <div class="side__foot">
      <a href="../index.html" target="_blank">↗ فتح الموقع</a>
      <a href="../offer/" target="_blank">↗ عرض السعر</a>
      <span id="modeNote">وضع المعاينة</span>
    </div>
  </aside>

  <!-- ============ المحتوى ============ -->
  <div class="main">
    <div class="topbar">
      <button class="burger2" id="burger" aria-label="القائمة">☰</button>
      <h1 id="title">لوحة القيادة</h1>
      <span class="mode" id="mode">جارٍ التحميل…</span>
      <button class="btn btn--o btn--s" id="btnReset">استعادة الأصل</button>
      <button class="btn btn--p" id="btnSave">
        <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        حفظ التغييرات
      </button>
    </div>
    <div class="page" id="view"></div>
  </div>
</div>

<!-- ============ نافذة التحرير ============ -->
<div class="modal" id="modal">
  <div class="modal__box">
    <div class="modal__head">
      <h3 id="mTitle">تحرير</h3>
      <button class="x" id="mClose">×</button>
    </div>
    <div class="modal__body" id="mBody"></div>
    <div class="modal__foot">
      <button class="btn btn--p" id="mSave">حفظ</button>
      <button class="btn btn--o" id="mCancel">إلغاء</button>
      <span style="flex:1"></span>
      <button class="btn btn--d" id="mDelete">حذف</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
