<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم المركزية — المنصّة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Light.woff2") format("woff2");font-weight:300;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Black.woff2") format("woff2");font-weight:800 900;font-display:swap}

  :root{
    --bg:#0a0a0b; --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.08);
    --bd:rgba(255,255,255,.12); --tx:#e9eaee; --muted:#9aa0aa;
    --accent:#3b82f6; --good:#22c55e; --bad:#ef4444; --gold:#f5a623; --violet:#8b5cf6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 800px at 80% -10%,#10233f 0%,transparent 60%),var(--bg);
    color:var(--tx);font-family:"Thmanyah Sans",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;line-height:1.65}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .muted{color:var(--muted)}
  .glass{background:var(--panel);border:1px solid var(--bd);border-radius:16px;backdrop-filter:blur(12px)}
  .btn{border:1px solid var(--bd);background:var(--panel2);color:var(--tx);border-radius:10px;
    padding:9px 14px;cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn.danger{color:#fca5a5;border-color:rgba(239,68,68,.4)}
  .btn.danger:hover{background:rgba(239,68,68,.15)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .btn svg,.btn i{width:15px;height:15px}
  input,select{background:rgba(0,0,0,.25);border:1px solid var(--bd);color:var(--tx);
    border-radius:10px;padding:10px 12px;font-size:14px;width:100%;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:rgba(59,130,246,.6)}
  /* login */
  #login{max-width:380px;margin:9vh auto;padding:26px}
  #login h1{font-size:20px;margin:0 0 4px}
  .field{margin:14px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .msg{font-size:13px;margin-top:10px;min-height:18px}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
  /* toolbar */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:16px}
  .toolbar input{max-width:260px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--bd);background:transparent;color:var(--muted);border-radius:999px;
    padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--accent);border-color:transparent;color:#fff}
  .count-note{margin-inline-start:auto;font-size:12.5px;color:var(--muted)}
  /* tenant card */
  .tenant{margin-bottom:14px;overflow:hidden}
  .t-head{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;flex-wrap:wrap}
  .t-head:hover{background:rgba(255,255,255,.03)}
  .t-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
  .t-title span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t-slug{font-size:12px;color:var(--muted);direction:ltr}
  .pill{font-size:11px;padding:2px 10px;border-radius:999px;border:1px solid var(--bd);color:var(--muted);white-space:nowrap}
  .pill.int{color:var(--gold);border-color:rgba(245,166,35,.4)}
  .pill.client{color:#93c5fd;border-color:rgba(59,130,246,.4)}
  .pill.trial{color:#c4b5fd;border-color:rgba(139,92,246,.4)}
  .t-meta{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .t-body{border-top:1px solid var(--bd);padding:16px 18px;display:none}
  .tenant.open .t-body{display:block}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tab{border:1px solid var(--bd);background:transparent;color:var(--muted);border-radius:9px;
    padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .tab.on{background:var(--panel2);color:var(--tx);border-color:rgba(255,255,255,.25)}
  /* apps grid */
  .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .app{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.03)}
  .app .nm{font-size:14px;font-weight:600}
  .app .ds{font-size:11px;color:var(--muted)}
  .app .cat{font-size:10px;color:var(--muted)}
  .badge-core{color:var(--accent)}
  .sw{position:relative;width:42px;height:24px;flex:none;cursor:pointer}
  .sw input{display:none}
  .sw .track{position:absolute;inset:0;background:rgba(255,255,255,.15);border-radius:999px;transition:.2s}
  .sw .knob{position:absolute;top:3px;right:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
  .sw input:checked + .track{background:var(--good)}
  .sw input:checked + .track + .knob{right:21px}
  /* members */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{color:var(--muted);font-weight:600;text-align:start;padding:7px 8px;font-size:12px;border-bottom:1px solid var(--bd)}
  td{padding:8px;border-bottom:1px solid rgba(255,255,255,.06)}
  td select{padding:5px 8px;font-size:12.5px;width:auto}
  .invite-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .invite-row input{flex:1;min-width:180px}
  .invite-row select{width:auto}
  /* audit */
  .audit-item{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;flex-wrap:wrap}
  .audit-item .when{color:var(--muted);font-size:11.5px;direction:ltr;white-space:nowrap}
  .audit-item .what{flex:1;min-width:200px}
  .a-tag{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--bd);color:var(--muted);margin-inline-end:6px}
  /* overlay */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;place-items:center;z-index:50;padding:16px}
  .overlay.show{display:grid}
  .sheet{width:100%;max-width:640px;max-height:82vh;overflow:auto;padding:20px}
  .sheet h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;justify-content:space-between}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .hidden{display:none}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;border:1px solid var(--bd);
    padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>

<!-- ===== تسجيل الدخول ===== -->
<section id="login" class="glass">
  <h1>لوحة التحكم المركزية</h1>
  <p class="muted" style="font-size:13px;margin:0">للشركاء (مدراء المنصّة) فقط.</p>
  <div class="field"><label>البريد الإلكتروني</label><input id="em" type="email" autocomplete="username" placeholder="you@example.com"></div>
  <div class="field"><label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
  <button class="btn primary" id="btnLogin" style="width:100%">دخول</button>
  <div class="msg" id="lmsg"></div>
</section>

<!-- ===== التطبيق ===== -->
<div id="app" class="wrap hidden">
  <header class="top">
    <div class="brand"><span class="dot"></span> لوحة التحكم المركزية</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="btnAudit"><i data-lucide="scroll-text"></i> سجل النشاط</button>
      <button class="btn primary" id="btnAdd"><i data-lucide="plus"></i> عميل جديد</button>
      <button class="btn ghost" id="btnLogout">خروج</button>
    </div>
  </header>

  <!-- شريط البحث والفلترة -->
  <div class="toolbar glass">
    <input id="q" placeholder="ابحث بالاسم أو المعرّف…">
    <div class="chips" id="planChips">
      <button class="chip on" data-plan="">الكل</button>
      <button class="chip" data-plan="internal">داخلي</button>
      <button class="chip" data-plan="client">عملاء</button>
      <button class="chip" data-plan="trial">تجارب</button>
    </div>
    <span class="count-note" id="countNote"></span>
  </div>

  <!-- نموذج عميل جديد -->
  <div id="addBox" class="glass hidden" style="padding:16px;margin-bottom:16px">
    <div class="row">
      <div style="flex:1;min-width:150px"><label class="muted" style="font-size:13px">اسم العميل</label><input id="newName" placeholder="مثال: شركة النور"></div>
      <div style="flex:1;min-width:150px"><label class="muted" style="font-size:13px">المعرّف (slug)</label><input id="newSlug" placeholder="al-noor"></div>
      <div><label class="muted" style="font-size:13px">النوع</label>
        <select id="newPlan"><option value="client">عميل</option><option value="trial">تجربة</option><option value="internal">داخلي</option></select></div>
      <label style="display:flex;align-items:center;gap:7px;font-size:13px;padding-bottom:10px;cursor:pointer">
        <input type="checkbox" id="newSeed" style="width:auto" checked> بيانات تجريبية</label>
      <button class="btn primary" id="btnCreate">إنشاء</button>
      <button class="btn ghost" id="btnCancelAdd">إلغاء</button>
    </div>
    <div class="msg" id="amsg"></div>
  </div>

  <div id="tenants"></div>
</div>

<!-- ===== سجل النشاط ===== -->
<div class="overlay" id="auditOverlay">
  <div class="glass sheet">
    <h3>سجل النشاط <button class="btn sm ghost" onclick="hideAudit()">إغلاق ✕</button></h3>
    <div id="auditList"><div class="empty">جارٍ التحميل…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://hdzzulhszeemxfhtgqmd.supabase.co';
const SUPA_KEY='sb_publishable_GG7Gdn_GIvNXAtKF2hJLqQ_rznycnDM';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);

const $=id=>document.getElementById(id);
let CATALOG=[], TENANTS=[], TAPPS={};        // TAPPS[tenant_id][app_key]=enabled
let OPEN=new Set(), TAB={}, MEMBERS={}, INVITES={}; // حالة كل بطاقة
let FILTER_PLAN='', FILTER_Q='';

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function lmsg(m,ok){const e=$('lmsg');e.textContent=m||'';e.className='msg '+(ok?'ok':'err')}
// تنظيف أي قيمة تُعرض داخل HTML — أسماء عملاء التجربة تُشتق من إيميلات خارجية
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icons(){if(window.lucide)lucide.createIcons()}
async function logAdmin(action,tenant,details){try{await sb.rpc('log_admin',{p_action:action,p_tenant:tenant,p_details:details||{}})}catch(e){}}

// ---------- auth ----------
async function doLogin(){
  const em=$('em').value.trim().toLowerCase(), pw=$('pw').value.trim();
  if(!em||!pw){lmsg('اكتب البريد وكلمة المرور.');return}
  lmsg('جارٍ الدخول...',true);
  const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
  if(error){lmsg('تعذّر الدخول: '+error.message);return}
  await gate(data.user);
}
async function logout(){await sb.auth.signOut();location.reload()}
async function gate(user){
  const {data,error}=await sb.rpc('is_platform_admin');
  if(error){lmsg('تعذّر التحقق: '+error.message);return}
  if(!data){await sb.auth.signOut();lmsg('هذه اللوحة لمدراء المنصّة فقط.');return}
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  await loadAll();
}

// ---------- data ----------
async function loadAll(){
  const [c,t,ta]=await Promise.all([
    sb.from('app_catalog').select('*').order('is_core',{ascending:false}).order('name'),
    sb.from('tenants').select('*').order('name'),
    sb.from('tenant_apps').select('tenant_id,app_key,enabled')
  ]);
  if(c.error||t.error||ta.error){toast('خطأ في التحميل');return}
  CATALOG=c.data; TENANTS=t.data; TAPPS={};
  (ta.data||[]).forEach(r=>{(TAPPS[r.tenant_id]=TAPPS[r.tenant_id]||{})[r.app_key]=r.enabled});
  render();
}

function planPill(p){
  const map={internal:['داخلي','int'],client:['عميل','client'],trial:['تجربة','trial']};
  const [label,cls]=map[p]||[p||'—',''];
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}

function visibleTenants(){
  const q=FILTER_Q.trim().toLowerCase();
  return TENANTS.filter(t=>
    (!FILTER_PLAN||t.plan===FILTER_PLAN) &&
    (!q||(t.name||'').toLowerCase().includes(q)||(t.slug||'').toLowerCase().includes(q)));
}

// ---------- render ----------
function render(){
  const wrap=$('tenants'); wrap.innerHTML='';
  const list=visibleTenants();
  $('countNote').textContent=`${list.length} من ${TENANTS.length} عميل`;
  if(!list.length){wrap.innerHTML='<div class="glass empty">لا نتائج مطابقة.</div>';return}
  list.forEach(t=>{
    const card=document.createElement('div');
    card.className='tenant glass'+(OPEN.has(t.id)?' open':'');
    const count=CATALOG.filter(a=>TAPPS[t.id]&&TAPPS[t.id][a.app_key]).length;
    card.innerHTML=`
      <div class="t-head" onclick="toggleOpen('${esc(t.id)}')">
        <div class="t-title"><span class="nm">${esc(t.name)}</span> ${planPill(t.plan)}</div>
        <span class="t-slug">${esc(t.slug)}</span>
        <div class="t-meta">
          <span class="pill">${count} تطبيق</span>
          <i data-lucide="${OPEN.has(t.id)?'chevron-up':'chevron-down'}" style="width:17px;height:17px;color:var(--muted)"></i>
        </div>
      </div>
      <div class="t-body" id="body-${esc(t.id)}">${OPEN.has(t.id)?bodyHTML(t):''}</div>`;
    wrap.appendChild(card);
  });
  icons();
}

function toggleOpen(id){
  if(OPEN.has(id)){OPEN.delete(id)}else{OPEN.add(id);TAB[id]=TAB[id]||'apps';if(TAB[id]==='members')loadMembers(id)}
  render();
}

function bodyHTML(t){
  const tab=TAB[t.id]||'apps';
  const tabs=`<div class="tabs">
    <button class="tab ${tab==='apps'?'on':''}" onclick="setTab('${esc(t.id)}','apps')">التطبيقات</button>
    <button class="tab ${tab==='members'?'on':''}" onclick="setTab('${esc(t.id)}','members')">الأعضاء</button>
    <button class="tab ${tab==='opts'?'on':''}" onclick="setTab('${esc(t.id)}','opts')">خيارات</button>
  </div>`;
  if(tab==='apps')return tabs+appsHTML(t);
  if(tab==='members')return tabs+membersHTML(t);
  return tabs+optsHTML(t);
}
function setTab(id,tab){TAB[id]=tab;if(tab==='members'&&!MEMBERS[id])loadMembers(id);render()}

// --- تبويب التطبيقات ---
function appsHTML(t){
  let h='<div class="apps">';
  CATALOG.forEach(a=>{
    const on=!!(TAPPS[t.id]&&TAPPS[t.id][a.app_key]);
    h+=`<div class="app">
      <div>
        <div class="nm">${esc(a.name)} ${a.is_core?'<span class="cat badge-core">• أساسي</span>':'<span class="cat">• '+esc(a.category||'')+'</span>'}</div>
        <div class="ds">${esc(a.description||'')}</div>
      </div>
      <label class="sw"><input type="checkbox" ${on?'checked':''}
          onchange="toggleApp(this,'${esc(t.id)}','${esc(a.app_key)}',this.checked)"><span class="track"></span><span class="knob"></span></label>
    </div>`;
  });
  return h+'</div>';
}
async function toggleApp(el,tenant_id,app_key,enabled){
  const t=TENANTS.find(x=>x.id===tenant_id);
  const a=CATALOG.find(x=>x.app_key===app_key);
  if(!enabled && !confirm(`إيقاف تطبيق «${a?a.name:app_key}» عن «${t?t.name:''}»؟\nسيختفي من واجهته فوراً (بياناته تبقى محفوظة).`)){
    el.checked=true; return;
  }
  const {error}=await sb.from('tenant_apps')
    .upsert({tenant_id,app_key,enabled},{onConflict:'tenant_id,app_key'});
  if(error){toast('تعذّر الحفظ: '+error.message);el.checked=!enabled;return}
  (TAPPS[tenant_id]=TAPPS[tenant_id]||{})[app_key]=enabled;
  logAdmin('app_toggle',tenant_id,{app:app_key,enabled});
  render();
  toast(enabled?'فُعّل التطبيق':'أُوقف التطبيق');
}

// --- تبويب الأعضاء ---
async function loadMembers(id){
  const [m,i]=await Promise.all([
    sb.rpc('tenant_members',{p_tenant:id}),
    sb.rpc('list_invites',{p_tenant:id})
  ]);
  MEMBERS[id]=m.data||[]; INVITES[id]=i.data||[];
  render();
}
function roleName(r){return {owner:'مالك',admin:'مدير',member:'عضو',viewer:'مشاهد',platform_admin:'مدير المنصّة'}[r]||r}
function membersHTML(t){
  const ms=MEMBERS[t.id], inv=INVITES[t.id]||[];
  let h='';
  if(!ms){h='<div class="empty">جارٍ تحميل الأعضاء…</div>'}
  else if(!ms.length&&!inv.length){h='<div class="empty">لا أعضاء بعد — أرسل أول دعوة.</div>'}
  else{
    h='<table><tr><th>البريد</th><th>الدور</th><th></th></tr>';
    ms.forEach(m=>{
      const locked=m.role==='platform_admin';
      h+=`<tr><td style="direction:ltr;text-align:end">${esc(m.email)}</td>
        <td>${locked?'<span class="pill int">مدير المنصّة</span>':
          `<select onchange="changeRole('${esc(t.id)}','${esc(m.user_id)}',this.value,this)">
            ${['owner','admin','member','viewer'].map(r=>`<option value="${r}" ${m.role===r?'selected':''}>${roleName(r)}</option>`).join('')}
          </select>`}</td>
        <td>${locked?'':`<button class="btn sm danger" onclick="removeMember('${esc(t.id)}','${esc(m.user_id)}','${esc(m.email)}')">إزالة</button>`}</td></tr>`;
    });
    inv.forEach(i=>{
      h+=`<tr><td style="direction:ltr;text-align:end">${esc(i.email)}</td>
        <td><span class="pill">${roleName(i.role)} — دعوة معلّقة</span></td>
        <td><button class="btn sm ghost" onclick="revokeInvite('${esc(t.id)}','${esc(i.email)}')">سحب الدعوة</button></td></tr>`;
    });
    h+='</table>';
  }
  h+=`<div class="invite-row">
    <input id="invEmail-${esc(t.id)}" type="email" placeholder="بريد العضو الجديد">
    <select id="invRole-${esc(t.id)}">
      <option value="member">عضو</option><option value="admin">مدير</option>
      <option value="viewer">مشاهد</option><option value="owner">مالك</option>
    </select>
    <button class="btn primary" onclick="invite('${esc(t.id)}')">دعوة</button>
  </div>
  <p class="muted" style="font-size:12px;margin:10px 0 0">إن كان البريد مسجّلاً يُضاف فوراً؛ وإلا تُحفظ دعوة تُفعّل تلقائياً عند تسجيله.</p>`;
  return h;
}
async function invite(id){
  const em=$('invEmail-'+id).value.trim(), role=$('invRole-'+id).value;
  if(!em){toast('اكتب البريد.');return}
  const {data,error}=await sb.rpc('invite_member',{p_tenant:id,p_email:em,p_role:role});
  if(error||data?.error){toast('تعذّر: '+(error?.message||data.error));return}
  logAdmin('member_invite',id,{email:em,role});
  toast(data.status==='added'?'أُضيف العضو':'أُرسلت الدعوة');
  await loadMembers(id);
}
async function changeRole(id,user,role,el){
  const {data,error}=await sb.rpc('set_member_role',{p_tenant:id,p_user:user,p_role:role});
  if(error||data?.error){toast(data?.error==='owner_protected'?'تغيير المالك لمدير المنصّة فقط':'تعذّر التغيير');await loadMembers(id);return}
  logAdmin('member_role',id,{user,role});
  toast('حُدّث الدور');
}
async function removeMember(id,user,email){
  if(!confirm(`إزالة ${email} من هذا العميل؟`))return;
  const {data,error}=await sb.rpc('remove_member',{p_tenant:id,p_user:user});
  if(error||data?.error){toast(data?.error==='owner_protected'?'إزالة المالك لمدير المنصّة فقط':'تعذّرت الإزالة');return}
  logAdmin('member_remove',id,{user,email});
  toast('أُزيل العضو'); await loadMembers(id);
}
async function revokeInvite(id,email){
  const {error}=await sb.rpc('revoke_invite',{p_tenant:id,p_email:email});
  if(error){toast('تعذّر السحب');return}
  toast('سُحبت الدعوة'); await loadMembers(id);
}

// --- تبويب خيارات ---
function optsHTML(t){
  return `<div class="row" style="align-items:center;gap:12px">
    <button class="btn" onclick="seedDemo('${esc(t.id)}')"><i data-lucide="database"></i> زرع بيانات تجريبية</button>
    <button class="btn danger" onclick="delTenant('${esc(t.id)}')"><i data-lucide="trash-2"></i> حذف العميل نهائياً</button>
  </div>
  <p class="muted" style="font-size:12.5px;margin:12px 0 0">
    «زرع بيانات تجريبية» يستبدل بيانات النظام لهذا العميل بنسخة العرض — مناسب لعملاء العرض والتجارب فقط.<br>
    «الحذف النهائي» يمسح العميل وكل بياناته (مهام، فواتير، غرف مشاريع…) ولا يمكن التراجع عنه.</p>`;
}
async function seedDemo(id){
  const t=TENANTS.find(x=>x.id===id);
  if(!confirm(`استبدال بيانات «${t.name}» ببيانات العرض التجريبي؟ بياناته الحالية ستُستبدل.`))return;
  const {data,error}=await sb.rpc('admin_seed_demo',{p_tenant:id});
  if(error||data?.error){toast('تعذّر الزرع: '+(error?.message||data.error));return}
  toast('زُرعت بيانات العرض');
}
async function delTenant(id){
  const t=TENANTS.find(x=>x.id===id);
  const typed=prompt(`⚠️ حذف نهائي لكل بيانات «${t.name}».\nللتأكيد اكتب اسم العميل كما هو:`);
  if(typed===null)return;
  if(typed.trim()!==t.name){toast('الاسم غير مطابق — أُلغي الحذف.');return}
  const {data,error}=await sb.rpc('admin_delete_tenant',{p_tenant:id});
  if(error||data?.error){toast('تعذّر الحذف: '+(error?.message||data.error));return}
  OPEN.delete(id); toast('حُذف العميل');
  await loadAll();
}

// ---------- عميل جديد ----------
function slugify(s){return (s||'').toString().trim().toLowerCase()
  .replace(/[^a-z0-9؀-ۿ]+/g,'-').replace(/^-+|-+$/g,'')}
async function createTenant(){
  const name=$('newName').value.trim();
  let slug=$('newSlug').value.trim()||slugify(name);
  const plan=$('newPlan').value, seed=$('newSeed').checked;
  const a=$('amsg'); a.className='msg';
  if(!name||!slug){a.textContent='اكتب الاسم والمعرّف.';a.className='msg err';return}
  a.textContent='جارٍ الإنشاء...'; a.className='msg ok';
  const {data:tr,error}=await sb.from('tenants').insert({slug,name,plan}).select('id').single();
  if(error){a.textContent='تعذّر: '+error.message;a.className='msg err';return}
  const coreRows=CATALOG.filter(c=>c.is_core).map(c=>({tenant_id:tr.id,app_key:c.app_key,enabled:true}));
  if(coreRows.length){await sb.from('tenant_apps').upsert(coreRows,{onConflict:'tenant_id,app_key'})}
  if(seed){await sb.rpc('admin_seed_demo',{p_tenant:tr.id})}
  logAdmin('tenant_create',tr.id,{name,slug,plan,seed});
  $('newName').value='';$('newSlug').value='';$('addBox').classList.add('hidden');
  await loadAll(); toast('أُنشئ العميل'+(seed?' مع بيانات تجريبية':''));
}

// ---------- سجل النشاط ----------
const ACTION_AR={app_toggle:'تطبيق',tenant_create:'عميل جديد',tenant_delete:'حذف عميل',
  member_invite:'دعوة عضو',member_role:'تغيير دور',member_remove:'إزالة عضو',seed_demo:'بيانات تجريبية'};
async function showAudit(){
  $('auditOverlay').classList.add('show');
  const {data,error}=await sb.from('admin_audit').select('*').order('created_at',{ascending:false}).limit(100);
  const el=$('auditList');
  if(error){el.innerHTML='<div class="empty">تعذّر التحميل — تأكد من تطبيق 80_admin_v2.sql</div>';return}
  if(!data.length){el.innerHTML='<div class="empty">لا نشاط مسجّل بعد.</div>';return}
  el.innerHTML=data.map(r=>{
    const d=r.details||{};
    let extra='';
    if(r.action==='app_toggle')extra=`${esc(d.app)} ← ${d.enabled?'تفعيل':'إيقاف'}`;
    else if(r.action==='member_invite'||r.action==='member_remove')extra=esc(d.email||'');
    else if(r.action==='member_role')extra=roleName(d.role||'');
    else if(r.action==='tenant_delete')extra=esc(d.name||'');
    return `<div class="audit-item">
      <div class="what"><span class="a-tag">${esc(ACTION_AR[r.action]||r.action)}</span>
        <b>${esc(r.tenant_name||d.name||'—')}</b> ${extra?'· '+extra:''}
        <div class="muted" style="font-size:11.5px;direction:ltr;text-align:end">${esc(r.actor_email||'')}</div></div>
      <div class="when">${new Date(r.created_at).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'})}</div>
    </div>`;
  }).join('');
}
function hideAudit(){$('auditOverlay').classList.remove('show')}

$('btnAdd').onclick=()=>$('addBox').classList.toggle('hidden');
