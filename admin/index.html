<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم المركزية — المنصّة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Black.woff2") format("woff2");font-weight:800 900;font-display:swap}
  :root{
    --bg:#0a0a0b; --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.08);
    --bd:rgba(255,255,255,.12); --tx:#e9eaee; --muted:#9aa0aa;
    --accent:#3b82f6; --good:#22c55e; --bad:#ef4444; --gold:#f5a623;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 800px at 80% -10%,#10233f 0%,transparent 60%),var(--bg);
    color:var(--tx);font-family:"Thmanyah Sans",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .muted{color:var(--muted)}
  .glass{background:var(--panel);border:1px solid var(--bd);border-radius:16px;backdrop-filter:blur(12px)}
  .btn{border:1px solid var(--bd);background:var(--panel2);color:var(--tx);border-radius:10px;
    padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn.ghost{background:transparent}
  input,select{background:rgba(0,0,0,.25);border:1px solid var(--bd);color:var(--tx);
    border-radius:10px;padding:10px 12px;font-size:14px;width:100%}
  /* login */
  #login{max-width:380px;margin:9vh auto;padding:26px}
  #login h1{font-size:20px;margin:0 0 4px}
  .field{margin:14px 0}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .msg{font-size:13px;margin-top:10px;min-height:18px}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
  /* tenants */
  .tenant{padding:18px;margin-bottom:16px}
  .tenant h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--bd);color:var(--muted)}
  .pill.int{color:var(--gold);border-color:rgba(245,166,35,.4)}
  .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
  .app{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.03)}
  .app .nm{font-size:14px;font-weight:600}
  .app .ds{font-size:11px;color:var(--muted)}
  .app .cat{font-size:10px;color:var(--muted)}
  .badge-core{color:var(--accent)}
  /* switch */
  .sw{position:relative;width:42px;height:24px;flex:none;cursor:pointer}
  .sw input{display:none}
  .sw .track{position:absolute;inset:0;background:rgba(255,255,255,.15);border-radius:999px;transition:.2s}
  .sw .knob{position:absolute;top:3px;right:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
  .sw input:checked + .track{background:var(--good)}
  .sw input:checked + .track + .knob{right:21px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .hidden{display:none}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;border:1px solid var(--bd);
    padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- ===== تسجيل الدخول ===== -->
<section id="login" class="glass">
  <h1>لوحة التحكم المركزية</h1>
  <p class="muted" style="font-size:13px;margin:0">للشركاء (مدراء المنصّة) فقط.</p>
  <div class="field"><label>البريد الإلكتروني</label><input id="em" type="email" autocomplete="username" placeholder="you@example.com"></div>
  <div class="field"><label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
  <div class="row" style="margin-top:6px">
    <button class="btn primary" id="btnLogin" style="flex:1">دخول</button>
    <button class="btn ghost" id="btnSignup">إنشاء حساب</button>
  </div>
  <div class="msg" id="lmsg"></div>
</section>

<!-- ===== التطبيق ===== -->
<div id="app" class="wrap hidden">
  <header class="top">
    <div class="brand"><span class="dot"></span> لوحة التحكم المركزية</div>
    <div class="row" style="gap:8px">
      <button class="btn" id="btnAdd">+ عميل جديد</button>
      <button class="btn ghost" id="btnLogout">خروج</button>
    </div>
  </header>

  <div id="addBox" class="glass hidden" style="padding:16px;margin-bottom:16px">
    <div class="row">
      <div style="flex:1;min-width:160px"><label class="muted" style="font-size:13px">اسم العميل</label><input id="newName" placeholder="مثال: شركة النور"></div>
      <div style="flex:1;min-width:160px"><label class="muted" style="font-size:13px">المعرّف (slug)</label><input id="newSlug" placeholder="al-noor"></div>
      <button class="btn primary" id="btnCreate">إنشاء</button>
      <button class="btn ghost" id="btnCancelAdd">إلغاء</button>
    </div>
    <div class="msg" id="amsg"></div>
  </div>

  <div id="tenants"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://hdzzulhszeemxfhtgqmd.supabase.co';
const SUPA_KEY='sb_publishable_GG7Gdn_GIvNXAtKF2hJLqQ_rznycnDM';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);

const $=id=>document.getElementById(id);
let CATALOG=[], TENANTS=[], TAPPS={}; // TAPPS[tenant_id][app_key]=enabled

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
// تنظيف أي قيمة تُعرض داخل HTML — أسماء عملاء التجربة تُشتق من إيميلات خارجية
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function lmsg(m,ok){const e=$('lmsg');e.textContent=m||'';e.className='msg '+(ok?'ok':'err')}

// ---------- auth ----------
async function doLogin(){
  const em=$('em').value.trim().toLowerCase(), pw=$('pw').value.trim();
  if(!em||!pw){lmsg('اكتب البريد وكلمة المرور.');return}
  lmsg('جارٍ الدخول...',true);
  const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
  if(error){lmsg('تعذّر الدخول: '+error.message);return}
  await gate(data.user);
}
async function doSignup(){
  const em=$('em').value.trim().toLowerCase(), pw=$('pw').value.trim();
  if(!em){lmsg('اكتب بريدك.');return} if(pw.length<8){lmsg('كلمة المرور 8 أحرف على الأقل.');return}
  lmsg('جارٍ إنشاء الحساب...',true);
  const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.href}});
  if(error){lmsg('تعذّر الإنشاء: '+error.message);return}
  if(data.session){await gate(data.user)} else {lmsg('تم الإنشاء — أكّد بريدك ثم سجّل الدخول.',true)}
}
async function logout(){await sb.auth.signOut();location.reload()}

// بوّابة: مدراء المنصّة فقط
async function gate(user){
  const {data,error}=await sb.rpc('is_platform_admin');
  if(error){lmsg('تعذّر التحقق: '+error.message);return}
  if(!data){await sb.auth.signOut();lmsg('هذه اللوحة لمدراء المنصّة فقط.');return}
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  await loadAll();
}

// ---------- data ----------
async function loadAll(){
  const [c,t,ta]=await Promise.all([
    sb.from('app_catalog').select('*').order('is_core',{ascending:false}).order('name'),
    sb.from('tenants').select('*').order('name'),
    sb.from('tenant_apps').select('tenant_id,app_key,enabled')
  ]);
  if(c.error||t.error||ta.error){toast('خطأ في التحميل');return}
  CATALOG=c.data; TENANTS=t.data; TAPPS={};
  (ta.data||[]).forEach(r=>{(TAPPS[r.tenant_id]=TAPPS[r.tenant_id]||{})[r.app_key]=r.enabled});
  render();
}

function render(){
  const wrap=$('tenants'); wrap.innerHTML='';
  TENANTS.forEach(t=>{
    const card=document.createElement('div'); card.className='tenant glass';
    const planPill=t.plan==='internal'?'<span class="pill int">داخلي</span>':'<span class="pill">'+esc(t.plan||'')+'</span>';
    let apps='';
    CATALOG.forEach(a=>{
      const on=!!(TAPPS[t.id]&&TAPPS[t.id][a.app_key]);
      apps+=`<div class="app">
        <div>
          <div class="nm">${esc(a.name)} ${a.is_core?'<span class="cat badge-core">• أساسي</span>':'<span class="cat">• '+esc(a.category||'')+'</span>'}</div>
          <div class="ds">${esc(a.description||'')}</div>
        </div>
        <label class="sw"><input type="checkbox" ${on?'checked':''}
            onchange="toggleApp('${esc(t.id)}','${esc(a.app_key)}',this.checked)"><span class="track"></span><span class="knob"></span></label>
      </div>`;
    });
    const count=CATALOG.filter(a=>TAPPS[t.id]&&TAPPS[t.id][a.app_key]).length;
    card.innerHTML=`<h2>${esc(t.name)} ${planPill} <span class="pill">${count} تطبيق مفعّل</span></h2>
      <div class="muted" style="font-size:12px;margin-top:2px">${esc(t.slug)}</div>
      <div class="apps">${apps}</div>`;
    wrap.appendChild(card);
  });
}

async function toggleApp(tenant_id, app_key, enabled){
  const {error}=await sb.from('tenant_apps')
    .upsert({tenant_id,app_key,enabled},{onConflict:'tenant_id,app_key'});
  if(error){toast('تعذّر الحفظ: '+error.message);return}
  (TAPPS[tenant_id]=TAPPS[tenant_id]||{})[app_key]=enabled;
  // حدّث العدّاد فقط
  render();
  toast(enabled?'فُعّل التطبيق':'أُوقف التطبيق');
}

// ---------- add tenant ----------
function slugify(s){return (s||'').toString().trim().toLowerCase()
  .replace(/[^a-z0-9؀-ۿ]+/g,'-').replace(/^-+|-+$/g,'')}
async function createTenant(){
  const name=$('newName').value.trim();
  let slug=$('newSlug').value.trim()||slugify(name);
  const a=$('amsg'); a.className='msg';
  if(!name||!slug){a.textContent='اكتب الاسم والمعرّف.';a.className='msg err';return}
  a.textContent='جارٍ الإنشاء...'; a.className='msg ok';
  const {data:tr,error}=await sb.from('tenants').insert({slug,name,plan:'client'}).select('id').single();
  if(error){a.textContent='تعذّر: '+error.message;a.className='msg err';return}
  // فعّل التطبيقات الأساسية للعميل الجديد
  const coreRows=CATALOG.filter(c=>c.is_core).map(c=>({tenant_id:tr.id,app_key:c.app_key,enabled:true}));
  if(coreRows.length){await sb.from('tenant_apps').upsert(coreRows,{onConflict:'tenant_id,app_key'})}
  $('newName').value='';$('newSlug').value='';$('addBox').classList.add('hidden');
  await loadAll(); toast('أُنشئ العميل وفُعّلت تطبيقاته الأساسية');
}

// ---------- wire ----------
$('btnLogin').onclick=doLogin;
$('btnSignup').onclick=doSignup;
$('btnLogout').onclick=logout;
$('btnAdd').onclick=()=>$('addBox').classList.toggle('hidden');
$('btnCancelAdd').onclick=()=>$('addBox').classList.add('hidden');
$('btnCreate').onclick=createTenant;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('newName').addEventListener('input',()=>{if(!$('newSlug').value)$('newSlug').placeholder=slugify($('newName').value)||'slug'});

// جلسة قائمة؟
(async()=>{const {data}=await sb.auth.getSession();if(data.session)await gate(data.session.user)})();
</script>
</body>
</html>
