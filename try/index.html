<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جرّب النظام مجاناً</title>
<meta name="description" content="جرّب نظام إدارة الأعمال — احصل على نسخة تجريبية مليئة بالبيانات خلال ثوانٍ.">
<link rel="icon" href="../logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Black.woff2") format("woff2");font-weight:900;font-display:swap}
  :root{--bg:#08080a;--tx:#eef0f4;--muted:#9aa1ad;--bd:rgba(255,255,255,.12);--glass:rgba(255,255,255,.05);--accent:#5b8cff;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(900px 600px at 80% -10%,#16233f 0,transparent 60%),var(--bg);
    color:var(--tx);font-family:"Thmanyah Sans",system-ui,Tahoma,sans-serif;line-height:1.7;display:flex;align-items:center;justify-content:center;padding:28px 16px}
  .card{width:100%;max-width:460px;background:var(--glass);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(14px);padding:26px}
  .logo{width:74px;height:74px;border-radius:18px;object-fit:cover;display:block;margin:0 auto 14px;border:1px solid var(--bd)}
  h1{font-weight:900;text-align:center;font-size:23px;margin:0 0 4px}
  .sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 18px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  input,textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--bd);color:var(--tx);border-radius:11px;padding:11px 13px;font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:62px}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .btn{margin-top:18px;width:100%;border:none;background:linear-gradient(120deg,#5b8cff,#9b6bff);color:#fff;font-weight:700;font-size:15px;border-radius:13px;padding:13px;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{margin-top:12px;font-size:13.5px;min-height:18px;text-align:center}
  .msg.err{color:#f87171}.msg.ok{color:#34d399}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
  .foot a{color:#9db4ff;text-decoration:none}
  ul.pp{list-style:none;padding:0;margin:6px 0 0;color:var(--muted);font-size:12.5px}
  ul.pp li{margin:3px 0}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="../logo.png" alt="" onerror="this.style.display='none'">
    <h1>جرّب النظام مجاناً</h1>
    <p class="sub">عبّئ بياناتك واحصل على نسخة تجريبية <b>مليئة ببيانات جاهزة</b> خلال ثوانٍ — تدخلها وتجرّب كل شيء.</p>

    <div class="row">
      <div><label>الاسم</label><input id="name" placeholder="اسمك"></div>
      <div><label>الشركة</label><input id="company" placeholder="اسم الشركة"></div>
    </div>
    <div class="row">
      <div><label>الجوال</label><input id="phone" inputmode="tel" placeholder="05xxxxxxxx"></div>
      <div><label>البريد الإلكتروني</label><input id="email" type="email" placeholder="you@example.com"></div>
    </div>
    <label>ماذا تحتاج؟ (اختياري)</label>
    <textarea id="needs" placeholder="مثال: نظام فواتير ومتابعة عملاء لمتجري"></textarea>
    <label>كلمة مرور للدخول (٨ أحرف على الأقل)</label>
    <input id="pw" type="password" placeholder="••••••••" autocomplete="new-password">

    <button class="btn" id="go">ابدأ التجربة الآن</button>
    <div class="msg" id="msg"></div>
    <ul class="pp">
      <li>• نسخة خاصة بك ببيانات تجريبية — جرّب الفواتير والعملاء والمشاريع.</li>
      <li>• بدون أي التزام — مجاناً.</li>
    </ul>
    <div class="foot"><a href="../">العودة للصفحة الرئيسية</a> · <a href="../app/">عندي حساب — دخول</a></div>
  </div>

<script>
const SUPA_URL='https://hdzzulhszeemxfhtgqmd.supabase.co';
const SUPA_KEY='sb_publishable_GG7Gdn_GIvNXAtKF2hJLqQ_rznycnDM';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const $=id=>document.getElementById(id);
function msg(t,ok){const e=$('msg');e.textContent=t||'';e.className='msg '+(ok?'ok':'err');}
$('go').onclick=async()=>{
  const name=$('name').value.trim(), company=$('company').value.trim(), phone=$('phone').value.trim();
  const email=$('email').value.trim().toLowerCase(), needs=$('needs').value.trim(), pw=$('pw').value.trim();
  if(!name||!email){msg('اكتب الاسم والبريد على الأقل.');return}
  if(pw.length<8){msg('كلمة المرور يجب أن تكون ٨ أحرف على الأقل.');return}
  $('go').disabled=true; msg('جارٍ تجهيز نسختك التجريبية…',true);
  try{ await sb.from('leads').insert({full_name:name,company,phone,email,needs,source:'trial'}); }catch(e){}
  const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+'/app/'}});
  if(error){$('go').disabled=false; msg(/registered|exists/i.test(error.message)?'هذا البريد مسجّل — اذهب لتسجيل الدخول.':'تعذّر: '+error.message);return}
  if(data.session){ msg('تم! جارٍ فتح نظامك التجريبي…',true); setTimeout(()=>location.href='../app/',700); }
  else { msg('تم إنشاء حسابك — افتح «دخول» وسجّل بنفس البيانات.',true); }
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
</script>
</body>
</html>
