<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<style id="thmanyah-font">
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Black.woff2") format("woff2");font-weight:800 900;font-display:swap}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>عنتر — إضافة مهمة</title>
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عنتر">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--gold:#f5a623;--gold2:#ffc24d;--line:#2c2c31;--panel:#141416}
  *{box-sizing:border-box}
  body{margin:0;background:#0a0a0b;color:#f4f4f5;font-family:'Thmanyah Sans','Tajawal',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}
  .wrap{width:100%;max-width:440px;text-align:center}
  .ico{font-size:60px;line-height:1;margin-bottom:6px}
  h1{margin:0 0 2px;font-size:24px;font-weight:900}
  h1 .g{color:var(--gold)}
  p.sub{color:#9b9ba3;margin:0 0 20px;font-size:14px}
  textarea{width:100%;min-height:120px;background:#000;border:1px solid var(--line);border-radius:14px;color:#fff;font-family:inherit;font-size:17px;padding:14px;resize:vertical}
  textarea:focus{outline:none;border-color:var(--gold)}
  button{width:100%;margin-top:12px;border:none;border-radius:12px;padding:15px;font-family:inherit;font-weight:800;font-size:17px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1205;cursor:pointer}
  button:active{filter:brightness(.95)}
  button:disabled{opacity:.6}
  .msg{margin-top:14px;font-size:15px;min-height:22px;font-weight:700}
  .ok{color:#22c55e}.err{color:#ef4444}
  .hint{margin-top:18px;color:#6b6b73;font-size:12px;line-height:1.7}
  .tag{display:inline-block;background:rgba(245,166,35,.14);color:var(--gold2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;margin:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="ico">🦅</div>
  <h1>عنتر <span class="g">— مهمة جديدة</span></h1>
  <p class="sub">اكتب المهمة وأرسلها لنظامك</p>
  <textarea id="t" placeholder="مثال: صوّر إعلان المتجر بكرة" autofocus></textarea>
  <button id="send" onclick="send()">➤ أرسل لعنتر</button>
  <div class="msg" id="msg"></div>
  <div style="margin-top:10px">
    <span class="tag">اليوم</span><span class="tag">بكرة</span><span class="tag">بعد بكرة</span><span class="tag">الأحد…السبت</span>
  </div>
  <div class="hint">💡 اكتب كلمة التاريخ ضمن المهمة ليجدولها عنتر تلقائياً.<br>أضف هذي الصفحة لشاشتك الرئيسية لتفتحها بضغطة.</div>
</div>
<script>
  const SUPA='https://rrerwhhxrjyzmnnjsfev.supabase.co';
  const PUB='sb_publishable_T-ka4hy2LVRjUuf0wUH9yA_g4Emxm13';
  const K=new URLSearchParams(location.search).get('k')||'';
  function setMsg(t,cls){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(cls||'')}
  if(!K)setMsg('الرابط ناقص الرمز (k). افتحه من الرابط الصحيح.','err');
  async function send(){
    const t=document.getElementById('t').value.trim();
    if(!t){setMsg('اكتب المهمة أولاً','err');return}
    if(!K){return}
    const b=document.getElementById('send');b.disabled=true;setMsg('جارٍ الإرسال…','');
    try{
      const r=await fetch(SUPA+'/rest/v1/rpc/antar_add',{method:'POST',headers:{'apikey':PUB,'Authorization':'Bearer '+PUB,'Content-Type':'application/json'},body:JSON.stringify({p_token:K,p_text:t})});
      const d=await r.json();
      if(r.ok && d==='added'){setMsg('✓ أضافها عنتر لنظامك','ok');document.getElementById('t').value='';}
      else if(d==='unauthorized'){setMsg('الرمز غير صحيح','err');}
      else{setMsg('تعذّر الإرسال، حاول مرة أخرى','err');}
    }catch(e){setMsg('تعذّر الاتصال بالشبكة','err');}
    b.disabled=false;
  }
  document.getElementById('t').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')send()});
</script>
</body>
</html>
