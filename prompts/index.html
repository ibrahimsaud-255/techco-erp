<!doctype html>
<html lang="ar" dir="rtl">
<head>
<style id="thmanyah-font">
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Black.woff2") format("woff2");font-weight:800 900;font-display:swap}
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<title>مكتبة البرومتات — إبراهيم سعود</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0a0b; --card:#141417; --soft:#1c1c20; --line:#2a2a30;
  --ink:#f3f1ea; --muted:#a7a39a; --gold:#e6b422; --gold2:#caa11c;
  --red:#e35d4f; --green:#43b36a;
}
[data-theme=light]{
  --bg:#f7f6f3; --card:#ffffff; --soft:#f0eee8; --line:#e3e0d8;
  --ink:#1a1a1a; --muted:#6a665e; --gold:#b8860b; --gold2:#a3760a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Thmanyah Sans',Tajawal,system-ui,sans-serif;line-height:1.7}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.topbar h1{font-size:1.35rem;font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
.topbar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#1a1500;border-color:var(--gold)}
.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:transparent}
.btn.danger:hover{border-color:var(--red)}
.btn.sm{padding:6px 12px;font-size:.82rem}
.icon{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
input,textarea,select{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:12px;color:var(--ink);
  font-family:inherit;font-size:.95rem;padding:11px 13px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:120px;line-height:1.8}
label{display:block;font-weight:700;font-size:.85rem;margin:0 0 6px;color:var(--muted)}
.row{display:grid;gap:12px}
@media(min-width:640px){.row.c2{grid-template-columns:1fr 1fr}}
.msg{font-size:.85rem;margin-top:8px}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)} .msg{color:var(--muted)}

/* تسجيل الدخول */
.login{max-width:420px;margin:8vh auto 0}
.login h2{margin:0 0 4px;font-size:1.3rem}
.login p{color:var(--muted);margin:0 0 18px;font-size:.9rem}

/* أدوات البحث */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}
.tools .search{flex:1;min-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:.82rem;font-weight:700;cursor:pointer}
.chip.on{background:var(--gold);color:#1a1500;border-color:var(--gold)}

/* الشبكة */
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.grid{grid-template-columns:1fr 1fr 1fr}}
.p-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.p-img{aspect-ratio:4/3;background:var(--soft);cursor:zoom-in;position:relative}
.p-img img{width:100%;height:100%;object-fit:cover;display:block}
.p-img.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:2rem;cursor:default}
.p-body{padding:15px;display:flex;flex-direction:column;gap:10px;flex:1}
.p-top{display:flex;align-items:start;justify-content:space-between;gap:8px}
.p-title{font-weight:800;font-size:1.02rem;margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.tag.cat{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.p-text{font-size:.86rem;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;white-space:pre-wrap;max-height:140px;overflow:auto;line-height:1.7}
.p-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.p-actions .btn{flex:1}
.empty-state{text-align:center;color:var(--muted);padding:50px 10px}

/* مودال الإضافة/التعديل */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;
  padding:20px;overflow:auto;z-index:50}
.modal .card{width:100%;max-width:640px;margin:auto}
.modal h2{margin:0 0 14px;font-size:1.2rem}
.prev-img{margin-top:8px;border-radius:12px;border:1px solid var(--line);max-height:200px;display:block}

/* لايتبوكس */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:60;cursor:zoom-out;padding:20px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}

/* توست */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--gold);color:#1a1500;
  padding:10px 20px;border-radius:999px;font-weight:800;opacity:0;transition:.25s;z-index:70}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.fab{position:fixed;left:22px;bottom:22px;z-index:40}
.fab .btn{box-shadow:0 8px 24px rgba(0,0,0,.4)}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div class="wrap login" id="login">
  <div class="card">
    <h2>🔐 مكتبة البرومتات</h2>
    <p>مساحتك الخاصّة لحفظ البرومتات وصورها — تسجيل الدخول للمدير فقط.</p>
    <div class="row">
      <div><label>البريد الإلكتروني</label><input id="em" type="email" placeholder="بريدك" autocomplete="username"></div>
      <div><label>كلمة المرور</label><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn gold" id="btnLogin" onclick="doLogin()">دخول</button>
      <div class="msg" id="lmsg"></div>
    </div>
  </div>
</div>

<!-- التطبيق -->
<div class="wrap hidden" id="app">
  <div class="topbar">
    <h1>🗂️ مكتبة البرومتات</h1>
    <div class="sp"></div>
    <button class="btn icon ghost" id="themeBtn" onclick="toggleTheme()" title="الوضع الليلي/الفاتح">🌙</button>
    <button class="btn gold" onclick="openAdd()">＋ برومت جديد</button>
    <button class="btn ghost sm" onclick="logout()">خروج</button>
  </div>

  <div class="tools">
    <input class="search" id="search" placeholder="🔎 ابحث في العنوان أو النص أو التصنيف…" oninput="render()">
  </div>
  <div class="chips" id="catChips"></div>

  <div class="grid" id="grid"></div>
  <div class="empty-state hidden" id="emptyState">لا توجد برومتات بعد. اضغط «＋ برومت جديد» لإضافة أول واحد.</div>
</div>

<!-- مودال الإضافة/التعديل -->
<div class="modal hidden" id="modal">
  <div class="card">
    <h2 id="modalTitle">برومت جديد</h2>
    <div class="row">
      <div class="row c2">
        <div><label>العنوان *</label><input id="f_title" placeholder="مثال: دمج منتج داخل مشهد"></div>
        <div><label>التصنيف</label><input id="f_category" list="catList" placeholder="مثال: دمج فوتوشوب"></div>
      </div>
      <div><label>الأداة (اختياري)</label><input id="f_tool" list="toolList" placeholder="Photoshop / Midjourney / DALL·E …"></div>
      <div><label>نص البرومت *</label><textarea id="f_body" placeholder="الصق نص البرومت هنا…"></textarea></div>
      <div>
        <label>صورة النتيجة (اختياري)</label>
        <input id="f_image" type="file" accept="image/*" onchange="onPickImage(event)">
        <div class="msg" id="imgStatus"></div>
        <img id="f_prev" class="prev-img hidden" alt="معاينة">
      </div>
      <div><label>ملاحظات (اختياري)</label><input id="f_notes" placeholder="إعدادات، نسخة الأداة، تلميحات…"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn gold" id="btnSave" onclick="save()" style="flex:1">💾 حفظ</button>
        <button class="btn ghost" onclick="closeModal()">إلغاء</button>
      </div>
      <div class="msg" id="saveMsg"></div>
    </div>
  </div>
</div>

<datalist id="catList"></datalist>
<datalist id="toolList"></datalist>

<div class="lb hidden" id="lb" onclick="this.classList.add('hidden')"><img id="lbImg" alt=""></div>
<div class="toast" id="toast">تم ✓</div>

<div class="fab hidden" id="fab"><button class="btn gold icon" onclick="openAdd()" title="برومت جديد" style="width:54px;height:54px;font-size:1.5rem">＋</button></div>

<script>
const SUPA_URL='https://rrerwhhxrjyzmnnjsfev.supabase.co';
const SUPA_KEY='sb_publishable_T-ka4hy2LVRjUuf0wUH9yA_g4Emxm13';
const ADMIN_EMAIL='ibrahimsaud25@gmail.com';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);

const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let USER=null, PROMPTS=[], EDIT_ID=null, NEW_IMAGE_URL='', ACTIVE_CAT='', toastT=null;

/* ===== الثيم ===== */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);
  $('themeBtn').textContent=t==='dark'?'☀️':'🌙';
  document.querySelector('meta[name=theme-color]').setAttribute('content',t==='dark'?'#0a0a0b':'#f7f6f3');}
function toggleTheme(){const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  localStorage.setItem('prompts_theme',t);applyTheme(t);}
applyTheme(localStorage.getItem('prompts_theme')||'dark');

/* ===== توست ===== */
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1500);}

/* ===== تسجيل الدخول ===== */
async function doLogin(){
  const em=$('em').value.trim().toLowerCase(),pw=$('pw').value.trim();
  if(!em||!pw){$('lmsg').className='msg err';$('lmsg').textContent='اكتب البريد وكلمة المرور.';return;}
  $('btnLogin').disabled=true;$('lmsg').className='msg';$('lmsg').textContent='جارٍ الدخول…';
  const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
  $('btnLogin').disabled=false;
  if(error){$('lmsg').className='msg err';$('lmsg').textContent='تعذّر الدخول: '+error.message;return;}
  enter(data.user);
}
async function enter(user){
  if(!user.email||user.email.toLowerCase()!==ADMIN_EMAIL){
    await sb.auth.signOut();$('lmsg').className='msg err';$('lmsg').textContent='هذه المساحة للمدير فقط.';return;}
  USER=user;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('fab').classList.remove('hidden');
  load();
}
async function logout(){await sb.auth.signOut();location.reload();}

/* ===== تحميل البرومتات ===== */
async function load(){
  const{data,error}=await sb.from('prompts').select('*').order('created_at',{ascending:false});
  if(error){$('grid').innerHTML='<div class="empty-state">تعذّر التحميل: '+esc(error.message)+'</div>';return;}
  PROMPTS=data||[];
  buildCats();render();
}

/* ===== تصنيفات ===== */
function uniqueCats(){return [...new Set(PROMPTS.map(p=>p.category).filter(Boolean))].sort();}
function uniqueTools(){return [...new Set(PROMPTS.map(p=>p.tool).filter(Boolean))].sort();}
function buildCats(){
  const cats=uniqueCats();
  $('catList').innerHTML=cats.map(c=>'<option value="'+esc(c)+'">').join('');
  $('toolList').innerHTML=uniqueTools().map(t=>'<option value="'+esc(t)+'">').join('');
  let html='<span class="chip '+(ACTIVE_CAT===''?'on':'')+'" onclick="setCat(\'\')">الكل</span>';
  html+=cats.map(c=>'<span class="chip '+(ACTIVE_CAT===c?'on':'')+'" onclick="setCat(\''+esc(c).replace(/'/g,"\\'")+'\')">'+esc(c)+'</span>').join('');
  $('catChips').innerHTML=html;
}
function setCat(c){ACTIVE_CAT=c;buildCats();render();}

/* ===== عرض ===== */
function render(){
  const q=$('search').value.trim().toLowerCase();
  let list=PROMPTS.slice();
  if(ACTIVE_CAT)list=list.filter(p=>p.category===ACTIVE_CAT);
  if(q)list=list.filter(p=>((p.title||'')+' '+(p.body||'')+' '+(p.category||'')+' '+(p.tool||'')+' '+(p.notes||'')).toLowerCase().includes(q));
  $('emptyState').classList.toggle('hidden',PROMPTS.length>0);
  if(!list.length && PROMPTS.length){$('grid').innerHTML='<div class="empty-state">لا نتائج مطابقة.</div>';return;}
  $('grid').innerHTML=list.map(card).join('');
}
function card(p){
  const img=p.image_url
    ? '<div class="p-img" onclick="lightbox(\''+esc(p.image_url)+'\')"><img src="'+esc(p.image_url)+'" loading="lazy" alt=""></div>'
    : '<div class="p-img empty">🖼️</div>';
  const tags=[p.category?'<span class="tag cat">'+esc(p.category)+'</span>':'',p.tool?'<span class="tag">'+esc(p.tool)+'</span>':''].join('');
  const notes=p.notes?'<div class="msg">📝 '+esc(p.notes)+'</div>':'';
  return '<div class="p-card">'+img+'<div class="p-body">'
    +'<div class="p-top"><h3 class="p-title">'+esc(p.title)+'</h3></div>'
    +(tags?'<div class="tags">'+tags+'</div>':'')
    +'<div class="p-text">'+esc(p.body)+'</div>'+notes
    +'<div class="p-actions">'
    +'<button class="btn gold sm" onclick="copyText(\''+p.id+'\')">📋 نسخ</button>'
    +'<button class="btn ghost sm" onclick="openEdit(\''+p.id+'\')">✏️ تعديل</button>'
    +'<button class="btn danger sm" onclick="del(\''+p.id+'\')">🗑️</button>'
    +'</div></div></div>';
}
function copyText(id){
  const p=PROMPTS.find(x=>x.id===id);if(!p)return;
  navigator.clipboard.writeText(p.body||'').then(()=>toast('تم نسخ البرومت ✓'))
    .catch(()=>toast('تعذّر النسخ'));
}
function lightbox(url){$('lbImg').src=url;$('lb').classList.remove('hidden');}

/* ===== إضافة / تعديل ===== */
function openAdd(){
  EDIT_ID=null;NEW_IMAGE_URL='';
  $('modalTitle').textContent='برومت جديد';
  $('f_title').value='';$('f_category').value=ACTIVE_CAT||'';$('f_tool').value='';
  $('f_body').value='';$('f_notes').value='';$('f_image').value='';
  $('f_prev').classList.add('hidden');$('imgStatus').textContent='';$('saveMsg').textContent='';
  $('modal').classList.remove('hidden');
}
function openEdit(id){
  const p=PROMPTS.find(x=>x.id===id);if(!p)return;
  EDIT_ID=id;NEW_IMAGE_URL=p.image_url||'';
  $('modalTitle').textContent='تعديل البرومت';
  $('f_title').value=p.title||'';$('f_category').value=p.category||'';$('f_tool').value=p.tool||'';
  $('f_body').value=p.body||'';$('f_notes').value=p.notes||'';$('f_image').value='';$('imgStatus').textContent='';$('saveMsg').textContent='';
  const pv=$('f_prev');if(p.image_url){pv.src=p.image_url;pv.classList.remove('hidden');}else pv.classList.add('hidden');
  $('modal').classList.remove('hidden');
}
function closeModal(){$('modal').classList.add('hidden');}

async function onPickImage(e){
  const f=e.target.files[0];if(!f)return;
  $('imgStatus').className='msg';$('imgStatus').textContent='⏳ جارٍ رفع الصورة…';
  try{
    const url=await uploadImage(f);NEW_IMAGE_URL=url;
    const pv=$('f_prev');pv.src=url;pv.classList.remove('hidden');
    $('imgStatus').className='msg ok';$('imgStatus').textContent='✓ تم رفع الصورة';
  }catch(err){$('imgStatus').className='msg err';$('imgStatus').textContent='تعذّر الرفع: '+(err.message||err);}
}
async function uploadImage(file){
  if(file.size>8000000)throw new Error('حجم الصورة كبير (أقل من 8MB)');
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path='prompts/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.'+ext;
  const{error}=await sb.storage.from('blog-images').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});
  if(error)throw error;
  return sb.storage.from('blog-images').getPublicUrl(path).data.publicUrl;
}

async function save(){
  const title=$('f_title').value.trim(), body=$('f_body').value.trim();
  if(!title||!body){$('saveMsg').className='msg err';$('saveMsg').textContent='العنوان ونص البرومت مطلوبان.';return;}
  const rec={
    title, body,
    category:$('f_category').value.trim(),
    tool:$('f_tool').value.trim(),
    notes:$('f_notes').value.trim(),
    image_url:NEW_IMAGE_URL||'',
    updated_at:new Date().toISOString()
  };
  $('btnSave').disabled=true;$('saveMsg').className='msg';$('saveMsg').textContent='جارٍ الحفظ…';
  let error;
  if(EDIT_ID){({error}=await sb.from('prompts').update(rec).eq('id',EDIT_ID));}
  else{({error}=await sb.from('prompts').insert(rec));}
  $('btnSave').disabled=false;
  if(error){$('saveMsg').className='msg err';$('saveMsg').textContent='خطأ: '+error.message;return;}
  closeModal();toast(EDIT_ID?'تم التعديل ✓':'تمت الإضافة ✓');load();
}

async function del(id){
  if(!confirm('حذف هذا البرومت نهائياً؟'))return;
  const{error}=await sb.from('prompts').delete().eq('id',id);
  if(error){toast('تعذّر الحذف');return;}
  toast('تم الحذف');load();
}

/* ===== جلسة محفوظة ===== */
(async()=>{const{data}=await sb.auth.getSession();if(data.session&&data.session.user)enter(data.session.user);})();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('lb').classList.add('hidden');}});
</script>
</body>
</html>
